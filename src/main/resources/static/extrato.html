<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrato - Banco Bootcamp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="marca">Banco <span>Bootcamp</span></div>
        <nav>
            <a href="/index.html">Início</a>
            <a href="/pix.html">PIX</a>
            <a href="/extrato.html" class="ativo">Extrato</a>
            <a href="/logout" class="sair">Sair</a>
        </nav>
    </header>

    <main class="container">
        <div class="card">
            <h2>Extrato de transações</h2>

            <div id="mensagem" style="display:none;"></div>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Descrição</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="lista-transacoes">
                    <tr><td colspan="6">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        carregarExtrato();
    </script>
</body>
</html>
