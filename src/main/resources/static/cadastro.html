<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Banco Bootcamp</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">B</div>
        <h1>Criar sua conta</h1>
        <p>É rápido, gratuito e sem burocracia</p>

        <div id="mensagem" style="display:none;"></div>

        <form id="form-cadastro">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Seu nome" required autofocus>
            </div>
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Mínimo 3 caracteres" minlength="3" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
            <div class="form-group">
                <label for="senha-confirma">Confirmar senha</label>
                <input type="password" id="senha-confirma" placeholder="Repita a senha" required>
            </div>
            <button type="submit" class="btn">Criar conta</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px;">
            Já tem conta?
            <a href="/login.html" style="color: var(--itau-laranja); font-weight: bold;">Fazer login</a>
        </p>
    </div>

    <script src="/js/app.js"></script>
    <script>
        configurarFormularioCadastro();
    </script>
</body>
</html>
