# Aplicação
spring.application.name=banco-app
server.port=8080

# Respeita os headers do proxy reverso (Codespaces, nuvem, etc.)
# Assim os redirects de login/logout mantêm o https e o host correto
server.forward-headers-strategy=framework

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:bancodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Console do H2 (útil para depuração): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
